      <input id="se-date-input" type="date" value="${todayISO()}" style="padding:8px 10px; border-radius:8px; border:1px solid var(--border); font-family:var(--font-mono); color:var(--text);">
      <select onchange="updateSEForm('severity',this.value)" style="padding:8px 10px; border-radius:8px; border:1px solid var(--border); color:var(--text); background:var(--panel);">
        ${SIDE_EFFECT_SEVERITY.map(s=>`<option value="${s.v}" ${sideEffectForm.severity===s.v?'selected':''}>${s.l}</option>`).join('')}
      </select>
    </div>
    <input id="se-note-input" placeholder="메모(선택)" style="width:100%; max-width:420px; padding:8px 10px; border-radius:8px; border:1px solid var(--border); color:var(--text); margin-bottom:8px;">
    <div><button class="btn btn-primary btn-sm" onclick="addSideEffect()">부작용 기록 추가</button></div>
  </div>`;
}
function renderSideEffectSection(){
  const sorted = [...state.sideEffects].sort((a,b)=>b.date.localeCompare(a.date));
  return `<section class="card">
    <div class="section-label good">${secNum('03a2')}이상반응(부작용) 기록</div>
    <p class="p-dim">오심·변비·주사부위반응 등을 차수와 함께 남겨두면, 나중에 "몇 차수부터 심해졌는지"를 체성분 변화 옆에서 같이 볼 수 있어요. 증량·감량 판단에 참고가 돼요.</p>
    ${renderSideEffectForm()}
    ${sorted.length ? `<div style="overflow-x:auto; margin-top:14px;">
      <table class="data-table">
        <thead><tr><th style="text-align:left">날짜</th><th style="text-align:left">증상</th><th>강도</th><th style="text-align:left">메모</th><th></th></tr></thead>
        <tbody>
          ${sorted.map(s => `<tr>

            <td style="text-align:left; font-family:var(--font-body);">${esc(s.symptom)}</td>
            <td class="${s.severity==='severe'?'warn-text':''}">${(SIDE_EFFECT_SEVERITY.find(x=>x.v===s.severity)||{}).l||s.severity}</td>
            <td style="text-align:left; color:var(--text-dim); font-family:var(--font-body);">${esc(s.note||'')}</td>
            <td><button class="mini-btn danger" onclick="deleteSideEffect('${s.id}')">삭제</button></td>
          </tr>`).join('')}
        </tbody>
      </table>
    </div>` : `<div class="sw-empty" style="margin-top:10px;">아직 기록된 이상반응이 없어요.</div>`}
  </section>`;
}

/* ---------- 잘하고 있는 점 / 아쉬운 점 (데이터 기반, 매번 재계산) ---------- */
function computeStrengthsAndImprovements(ib, workouts, meals){
  const strengths = [];
  const improvements = [];
  if(ib.length < 2) return {strengths, improvements};
  const first = ib[0], last = ib[ib.length-1];
  const today = todayISO();

  const weightLoss = first.weight - last.weight;
  const fatMassLoss = first.fat - last.fat;
  const muscleAssess = computeMuscleAssessment(first, last);
  const achieveRate18 = Math.min(100, Math.max(0, ((START_FAT_PCT-last.fatPct)/(START_FAT_PCT-18))*100));
  const achieveRate20 = Math.min(100, Math.max(0, ((START_FAT_PCT-last.fatPct)/(START_FAT_PCT-20))*100));

  const last7Dates = Array.from({length:7}, (_,i) => { const d=new Date(today+'T00:00:00'); d.setDate(d.getDate()-i); return toLocalISO(d); });
  const workoutDaysLast7 = last7Dates.filter(d => { const t=classifyDayType(workouts,d); return t && t.type!=='휴식'; }).length;

  const recentMeals = [...meals].sort((a,b)=>b.date.localeCompare(a.date)).slice(0,10);
  const proteinRate = recentMeals.length ? (recentMeals.filter(m => (m.protein||0) >= PROTEIN_TARGET.min).length / recentMeals.length * 100) : null;

  const calorieRate = (last.bmr && recentMeals.length) ? (recentMeals.filter(m => {
    const lo = last.bmr*1.5-550, hi = lo+100;
    return (m.calories||0) <= hi+50;
  }).length / recentMeals.length * 100) : null;

  const ma = movingAverage(ib, 'fatPct', 7);
  const recentMA = ma.slice(-7);
  const maTrend = recentMA.length>=2 ? recentMA[recentMA.length-1].fatPctMA - recentMA[0].fatPctMA : 0;

  const last3fat = ib.slice(-3).map(r=>r.fat);
  const fatSpread = last3fat.length>=3 ? Math.max(...last3fat)-Math.min(...last3fat) : null;

  const lastLogGapDays = Math.round((new Date(today) - new Date(last.date)) / 86400000);

  // 잘하고 있는 점 후보
  if(weightLoss > 0) strengths.push({title:'체중 꾸준히 감소', detail:`시작 대비 ${fmt(weightLoss)}kg 감량 (${first.date.slice(5)} ${fmt(first.weight)}kg → ${last.date.slice(5)} ${fmt(last.weight)}kg)`});
  if(fatMassLoss > 0) strengths.push({title:'체지방량 감소', detail:`시작 대비 ${fmt(fatMassLoss)}kg 감량`});
  if(achieveRate20 >= 100) strengths.push({title:'1차 목표(20%) 달성 완료 ✓', detail:`체지방률 ${fmt(START_FAT_PCT)}% → ${fmt(last.fatPct)}%로 1차 목표를 이미 넘어섰어요.`});
  else if(achieveRate20 >= 50) strengths.push({title:'1차 목표(20%) 절반 이상 달성', detail:`현재 달성률 ${fmt(achieveRate20,0)}%`});
  if(achieveRate18 >= 100) strengths.push({title:'2차 목표(18%) 달성 완료 ✓', detail:`체지방률 ${fmt(START_FAT_PCT)}% → ${fmt(last.fatPct)}%로 최종 목표까지 달성했어요!`});
  else if(achieveRate18 >= 50) strengths.push({title:'2차 목표(18%) 절반 이상 달성', detail:`현재 달성률 ${fmt(achieveRate18,0)}%`});
  if(muscleAssess.tone === 'good') strengths.push({title:'골격근 보존 우수', detail: muscleAssess.muscleLoss<=0 ? `골격근량 감소 없이 유지 중 (현재 ${fmt(last.muscle)}kg)` : `체중 -${fmt(muscleAssess.weightLossPct,1)}% 대비 골격근 -${fmt(muscleAssess.muscleLossPct,1)}% — 비율 ${fmt(muscleAssess.ratio,2)}로 SURMOUNT-1 DEXA 실측 기준(0.51)보다 낮아요`});
  if(workoutDaysLast7 >= 4) strengths.push({title:'꾸준한 운동 습관', detail:`최근 7일 중 ${workoutDaysLast7}일 운동`});
  if(proteinRate !== null && proteinRate >= 70) strengths.push({title:'단백질 섭취 잘 지킴', detail:`최근 10끼 중 ${fmt(proteinRate,0)}%에서 목표(${PROTEIN_TARGET.min}~${PROTEIN_TARGET.max}g) 충족`});
  if(calorieRate !== null && calorieRate >= 70) strengths.push({title:'칼로리 목표 준수 양호', detail:`최근 10끼 중 ${fmt(calorieRate,0)}%가 목표 범위 안`});
  if(maTrend <= -0.2) strengths.push({title:'체지방률 추세 개선 중', detail:`7일 이동평균 기준 ${fmt(Math.abs(maTrend),2)}%p 하락`});

  // 아쉬운 점 후보
  if(fatSpread !== null && fatSpread <= 0.15) improvements.push({title:'체지방 감량 정체', detail:`최근 3회 측정에서 체지방량이 ${fmt(Math.min(...last3fat))}~${fmt(Math.max(...last3fat))}kg 사이 정체`});
  if(muscleAssess.tone === 'warn') improvements.push({title:'골격근 손실 비중 높음', detail: muscleAssess.weightLossPct<=0.3 ? `체중 변화 없이 골격근만 ${fmt(muscleAssess.muscleLoss)}kg 감소 — 단백질·저항운동 점검 필요` : `체중 -${fmt(muscleAssess.weightLossPct,1)}% 대비 골격근 -${fmt(muscleAssess.muscleLossPct,1)}%, 비율 ${fmt(muscleAssess.ratio,2)}로 SURMOUNT-1 DEXA 실측 기준(0.51)보다 높아요`});
  if(proteinRate !== null && proteinRate < 50) improvements.push({title:'단백질 섭취 부족 빈도 높음', detail:`최근 10끼 중 목표 충족 ${fmt(proteinRate,0)}%뿐`});
  if(calorieRate !== null && calorieRate < 50) improvements.push({title:'칼로리 목표 이탈 빈도 높음', detail:`최근 10끼 중 목표 범위 준수 ${fmt(calorieRate,0)}%뿐 — 목표 재설정이나 식단 조정이 필요할 수 있어요`});
  if(workoutDaysLast7 <= 2) improvements.push({title:'최근 운동 빈도 낮음', detail:`최근 7일 중 ${workoutDaysLast7}일만 운동`});
  if(ib.length >= 3){
    const last3w = ib.slice(-3).map(r=>r.weight);
    if(last3w[last3w.length-1] >= last3w[0]) improvements.push({title:'체중 정체 또는 반등', detail:`최근 측정에서 ${fmt(last3w[0])}kg → ${fmt(last3w[last3w.length-1])}kg으로 줄지 않음`});
  }
  if(lastLogGapDays >= 2) improvements.push({title:'최근 인바디 기록 공백', detail:`마지막 측정일이 ${last.date} — ${lastLogGapDays}일째 기록이 없어요. 추세 판단 정확도가 떨어질 수 있어요`});

  return {strengths: strengths.slice(0,5), improvements: improvements.slice(0,5)};
}

// 주간 계획: 고정 로테이션이 아니라, 각 근력 슬롯 시점까지의 '실제' 회복 데이터를 매번 다시 계산해서
// 가장 오래 방치된 부위 그룹을 배정합니다. 캐시하지 않고 매번 최신 workouts로 재계산되므로,
// 계획과 다르게 운동했거나 건너뛴 경우 다음 슬롯부터 자동으로 반영됩니다.
const STRENGTH_GROUPS = [
  {label:'하체', parts:['하체']},
  {label:'등·이두', parts:['등','이두']},
  {label:'가슴·어깨·삼두', parts:['가슴','어깨','삼두']},
];
function getWeeklyPlan(workouts, mondayDate){
  const dates = getWeekDates(mondayDate);
  const plan = {};
  // 2026-07-16 변경: 월/수/금 → 이번 주(~7/19)는 월/수/토, 7/20(월)부터는 월/목/토로 슬롯 변경
  const strengthSlots = mondayDate >= '2026-07-20' ? [0,3,5] : [0,2,5]; // 월/목/토(7/20~) 또는 월/수/토(~7/19)
  const cardioSlots = [0,1,2,3,4,5,6].filter(i=>!strengthSlots.includes(i)); // 나머지 요일(일요일은 자율 라벨 유지)
  const usedGroups = new Set();

  strengthSlots.forEach(di => {
    const date = dates[di];
    const recovery = computeBodyPartRecovery(workouts, date, true); // 그 날짜 이전까지의 실제 데이터 기준
    const recMap = Object.fromEntries(recovery.map(r=>[r.part, r.daysElapsed===null ? 999 : r.daysElapsed]));
    const candidates = STRENGTH_GROUPS.filter(g=>!usedGroups.has(g.label))
      .map(g => ({...g, score: Math.max(...g.parts.map(p=>recMap[p]))}))
      .sort((a,b)=>b.score-a.score);
    const chosen = candidates[0] || STRENGTH_GROUPS[Math.floor(Math.random()*STRENGTH_GROUPS.length)];
    usedGroups.add(chosen.label);
    const worstPart = [...chosen.parts].sort((a,b)=>recMap[b]-recMap[a])[0];
    const worstDays = recMap[worstPart];
    plan[date] = {
      type:'근력', label:chosen.label,
      reason: worstDays>=999 ? `${worstPart} 기록 없음 — 우선 배정` : `${worstPart} 마지막 자극 후 ${worstDays}일 경과 — 가장 방치된 그룹`
    };
  });
  cardioSlots.forEach(di => { plan[dates[di]] = {type:'유산소', label: di===6 ? '인클라인 트레드밀(자율)' : '인클라인 트레드밀'}; });
  const thuDate = dates[3];
  if(state.mounjaroDoses.some(d=>d.date===thuDate)) plan[thuDate].label += '(투여일, 가볍게)';
  return plan;
}
function planForDate(date, workouts){
  return getWeeklyPlan(workouts, isoWeekKey(date))[date] || null;
}
function planLabelToParts(label){
  if(!label) return [];
  return BODY_PARTS.filter(p => label.includes(p));
}

function classifyDayType(workouts, date){
  const entries = workouts.filter(w=>w.date===date);
  if(entries.length===0) return null;
  const restOnly = entries.every(w => w.part==='회복');
  if(restOnly) return {type:'휴식', label:entries[0].name||'휴식'};
  let hasStrength=false, hasCardio=false, labels=[];
  entries.forEach(w=>{
    // 2026-07-25 수정: exercises 배열(구조화 데이터)이 있는 항목은 note 자유텍스트를 유산소
    // 키워드 스캔 대상에서 제외함. note에 심박존 설명 등으로 "유산소"/"인클라인" 단어가 우연히
    // 포함되면(심지어 "인클라인 안 함" 같은 부정문이어도) 오탐되는 문제가 실제 발생함(2026-07-25,
    // 근력만 한 날인데 note의 심박존 설명 때문에 "둘다"로 잘못 분류·인클라인 이력에도 잘못 추가됨).
    // exercises가 없는 레거시 항목(SEED_WORKOUT 등)은 기존 note 스캔 방식 그대로 유지(회귀 방지 —
    // 예: 6/6·6/7·6/16 등은 part엔 유산소 표시가 없고 note에만 "인클라인 트레드밀 Nkm..."로 적혀있어
    // note 스캔이 반드시 필요함).
    const hasStructuredExercises = !!(w.exercises && w.exercises.length);
    const text = hasStructuredExercises ? `${w.name||''} ${w.part||''}` : `${w.name||''} ${w.part||''} ${w.note||''}`;
    if(inferPartsForEntry(w).some(p=>BODY_PARTS.includes(p))) hasStrength=true;
    // 정책 변경(2026-07-15): "혈당" 키워드 자동제외 방식 폐기 — 취약한 텍스트매칭이었음.
    // 이제는 산책의 속도/심박 데이터가 목표존(105-125bpm)·브리스크 페이스에 해당하면
    // Claude가 데이터 입력 시점에 직접 판단해 정상 유산소로 등록함(근거 없으면 미등록).
    if(parseKm(text)>0 || text.includes('유산소') || text.includes('트레드밀') || text.includes('사이클') || text.includes('걷기')) hasCardio=true;
    labels.push(w.name);
  });
  const type = hasStrength && hasCardio ? '둘다' : hasStrength ? '근력' : hasCardio ? '유산소' : '휴식';
  return {type, label: labels.join(' / ')};
}

function getWeekDates(mondayDate){
  return Array.from({length:7},(_,i)=>{ const d=new Date(mondayDate+'T00:00:00'); d.setDate(d.getDate()+i); return toLocalISO(d); });
}

let planDetailDate = null;
function donutChartSVG(segments, size){
  size = size || 150;
  const total = segments.reduce((s,x)=>s+x.value,0);
  const r = size/2 - 16, cx=size/2, cy=size/2, circumference = 2*Math.PI*r;
  let offset = 0;
  const arcs = segments.map(seg => {
    const frac = total>0 ? seg.value/total : 0;
    const dash = frac*circumference;
    const el = `<circle cx="${cx}" cy="${cy}" r="${r}" fill="none" style="stroke:${seg.color}" stroke-width="20" stroke-dasharray="${dash.toFixed(1)} ${(circumference-dash).toFixed(1)}" stroke-dashoffset="${(-offset).toFixed(1)}" transform="rotate(-90 ${cx} ${cy})" stroke-linecap="butt"/>`;
    offset += dash;
    return el;
  }).join('');
  return `<svg viewBox="0 0 ${size} ${size}" style="width:100%; max-width:170px; display:block; margin:0 auto;">
    <circle cx="${cx}" cy="${cy}" r="${r}" fill="none" style="stroke:var(--c-track)" stroke-width="20"/>
    ${arcs}
  </svg>`;
}
function donutLegend(segments){
  const total = segments.reduce((s,x)=>s+x.value,0);
  return `<div class="donut-legend">${segments.map(s=>`<div class="donut-legend-item"><span class="legend-dot" style="background:${s.color}"></span>${s.label} <b>${total>0?fmt(s.value/total*100,0):0}%</b></div>`).join('')}</div>`;
}

          if(diffPct >= 15) neatInsight = {tone:'good', text:`최근 7일 평균 NEAT ${fmt(avgNeat,0)}보로, 이전 7일(${fmt(avgNeatPrior,0)}보) 대비 ${fmt(diffPct,0)}% 늘었어요. 일상활동량이 증가 추세예요.`};
          else if(diffPct <= -15) neatInsight = {tone:'warn', text:`최근 7일 평균 NEAT ${fmt(avgNeat,0)}보로, 이전 7일(${fmt(avgNeatPrior,0)}보) 대비 ${fmt(Math.abs(diffPct),0)}% 줄었어요. 일상활동량 감소가 체지방 정체에 영향을 줬을 수 있어요.`};
          else neatInsight = {tone:'neutral', text:`최근 7일 평균 NEAT ${fmt(avgNeat,0)}보로 이전 7일(${fmt(avgNeatPrior,0)}보)과 큰 변동 없이 유지되고 있어요.`};
        }

        return `
          <div class="insight-grid" style="margin-bottom:16px;">
            <div class="card insight tone-neutral">
              <div class="ic-label"><span class="ic-icon">${ICONS.award}</span>최근 7일 평균 총 걸음</div>

            <div class="card insight tone-neutral">
              <div class="ic-label"><span class="ic-icon">${ICONS.target}</span>최근 7일 평균 NEAT</div>
              <div class="ic-value">${avgNeat?fmt(avgNeat,0):'—'}</div>

            </div>

          ${neatInsight ? `<div class="alert-item ${neatInsight.tone==='warn'?'tone-warn-item':neatInsight.tone==='good'?'tone-good-item':''}" style="margin-bottom:16px;">

          </div>` : ''}
          ${chartCard('일별 총 걸음수', chartData, 'steps', '보', '--c-neutral')}

                  <td class="good-text">${b.neat.toLocaleString()}</td>
                  <td>${b.km}km</td>
                  <td>${b.kcal}kcal</td>
                </tr>`).join('')}
              </tbody>
            </table>
          </div>` : ''}
          <div class="note-box" style="margin-top:12px;">그날 인클라인 트레드밀 운동을 하셨으면, 그 세션의 걸음수를 총 걸음수에서 빼서 "NEAT"(순수 일상활동)로 따로 계산해요 — 총 걸음수엔 이미 트레드밀 걸음이 포함돼 있어서 중복 집계를 막기 위함이에요.</div>
        `;
      })()}
    </section>

    <section class="card">
      <div class="section-label good">${secNum('W4c')}인클라인 트레드밀 이력 <span class="dim" style="font-weight:500; text-transform:none; letter-spacing:0;">· 목표 심박존 ${CARDIO_HR_TARGET.min}-${CARDIO_HR_TARGET.max}bpm</span></div>
      ${(() => {
        const hist = computeInclineHistory(workouts);
        if(hist.length===0) return `<div class="empty-state" style="padding:30px 10px;">인클라인 트레드밀 기록이 없습니다.</div>`;

        return `${hist.length>15 ? expandToggleRow('inclineHistory', hist.length, '전체 이력 보기') : ''}
        <div style="overflow-x:auto; margin-top:10px;">

        </div>`;

    </section>

    <section>
      <div class="section-label" style="display:flex; justify-content:space-between; align-items:center;">
        <span>${secNum('W5')}운동 기록</span>
        <button class="btn btn-primary btn-sm" onclick="openModal('workout')">+ 운동 기록 추가</button>
      </div>
      <div class="card" style="padding:4px 16px;">
        ${(state.expandedTables['workoutList'] ? sortedW : sortedW.slice(0,30)).map(w => workoutRow(w)).join('')}

      </div>
    </section>
  `;
}

  return `<div class="day-row" style="grid-template-columns:64px 1fr;">

      <div style="font-size:12px; color:var(--text-dim); margin-top:3px;">${parts.join(', ')||esc(w.part||'')}${w.volume?` · ${esc(String(w.volume))}`:''}${w.calories?` · ${w.calories}kcal`:''}</div>
      ${w.note?`<div style="font-size:11.5px; color:var(--text-faint); margin-top:3px;">${esc(w.note)}</div>`:''}

    </div>
  </div>`;
}
function renderDashboard(){
  const {insights, last, ma} = computeInsights();
  // 2026-08-04: 동기화 표시가 대시보드 전용 배너 → 모든 탭 공통 상단바 배지로 바뀌면서
  // 여기서 배너를 그릴 필요가 없어짐(HEADER_TEMPLATE의 top-sync-badge가 그 역할을 대신함).
  if(!last) return `<div class="empty-state">아직 기록이 없습니다. 상단의 '기록 추가'로 첫 기록을 남겨보세요.</div>`;
  const ib = sortedInbody();
  const recentMA = ma.slice(-7);
  const maTrend7 = recentMA.length>=2 ? recentMA[recentMA.length-1].fatPctMA - recentMA[0].fatPctMA : null;

  return `
    <section class="hero card">

        </div>
      </div>
      <div class="hero-grid">
        <div class="hero-figure">
          ${gaugeSVG(last.fatPct, START_FAT_PCT, FAT_GOALS)}
          <div class="gauge-value mono">${fmt(last.fatPct)}<span class="gauge-unit">%</span></div>
          <div class="gauge-sub">현재 체지방률 · 시작 대비 ${fmt(START_FAT_PCT-last.fatPct)}%p 감소</div>
          ${maTrend7!==null ? `<div class="gauge-sub" style="margin-top:2px; font-size:11px; color:${maTrend7<=-0.05?'var(--c-good)':maTrend7>=0.05?'var(--c-warn)':'var(--text-faint)'};">7일 이동평균 대비 ${maTrend7>0?'+':''}${fmt(maTrend7,2)}%p ${maTrend7<=-0.05?'↓ 개선 중':maTrend7>=0.05?'↑ 정체/반등':'· 거의 변화 없음'}</div>` : ''}
          <div class="gauge-legend">
            <span><span class="legend-dot legend-dot-progress"></span>진행</span>
            <span><span class="legend-dot legend-dot-goal"></span>목표(20%·18%)</span>
          </div>
        </div>
        <div class="hero-side">
          <div class="hero-stat"><span class="l">체중</span><span class="v mono">${fmt(last.weight)} kg</span></div>
          <div class="hero-stat"><span class="l">골격근량</span><span class="v mono">${fmt(last.muscle)} kg</span></div>
          <div class="hero-stat"><span class="l">체지방량</span><span class="v mono">${fmt(last.fat)} kg</span></div>
          <div class="hero-stat"><span class="l">최근 기초대사량(BMR)</span><span class="v mono">${last.bmr ?? '—'} kcal</span></div>
          <div class="hero-stat"><span class="l">최근 측정일</span><span class="v mono">${last.date}</span></div>
        </div>
      </div>
      <div class="hero-goals">
        ${FAT_GOALS.map(g=>{
          const totalDist = START_FAT_PCT-g.pct;
          const progressed = Math.min(100, Math.max(0, ((START_FAT_PCT-last.fatPct)/totalDist)*100));
          const done = last.fatPct<=g.pct;
          const remain = Math.max(0, last.fatPct-g.pct);
          const other = last.weight - last.muscle - last.fat;
          // [2026-07-29 변경] Live Tracking 1차/2차 목표 계산: 회복기준(33.2kg 고정) 대신
          // 오늘 실측 골격근량을 그대로 사용(목표탭 "오늘 실측 골격근 기준" 행과 동일 방식으로 통일)
          const targetMuscle = last.muscle;
          const t = g.pct/100;
          const targetFat = t*(other+targetMuscle) / (1-t);
          const fatLossNeeded = Math.max(0, last.fat - targetFat);
          return `<div class="hero-goal-item">
            <div class="hg-top">
              <span class="hg-label">${g.label} <span class="dim">· 목표 ${g.pct}%</span></span>
              <span class="hg-status ${done?'done':''}">${done?'달성 완료':`${fmt(remain)}%p 남음`}</span>
            </div>
            <div class="hg-bar"><div class="hg-fill" style="width:${progressed}%"></div></div>
            <div class="hg-foot"><span>진행률 ${fmt(progressed,0)}%</span><span>${fmt(START_FAT_PCT)}% → ${fmt(last.fatPct)}% → ${g.pct}%</span></div>
            <div class="hg-detail">${done ? '체지방량 목표 달성 — 유지 단계로 전환' : `현재 체지방량 ${fmt(last.fat)}kg → 약 <b>-${fmt(fatLossNeeded)}kg</b> 추가 감량 필요 (목표 체지방량 ${fmt(targetFat)}kg)`}</div>
          </div>`;
        }).join('')}
      </div>
      <div class="note-box" style="margin-top:10px;">필요 감량치는 <b>오늘 실측 골격근량(${fmt(last.muscle)}kg)</b>이 그대로 유지된다는 가정으로 계산해요. 골격근이 늘면 이 값은 다음 측정 때 자동으로 갱신돼요.</div>
    </section>

    ${state.aiNote ? `
    <section class="card ai-note">
      <div class="section-label good">${secNum('00')}Claude 분석 <span class="dim" style="font-weight:500; text-transform:none; letter-spacing:0;">· ${state.aiNote.syncedAt ? fmtDateTime(state.aiNote.syncedAt) : state.aiNote.date} 갱신</span></div>
      <div class="ai-note-body">${esc(state.aiNote.text).replace(/\n/g,'<br>')}</div>
    </section>` : ''}

    <section class="card">
      <div class="section-label good">${secNum('00b')}스마트 인사이트 <span class="dim" style="font-weight:500; text-transform:none; letter-spacing:0;">· ${state.lastUpdated ? '최종 갱신 '+fmtDateTime(state.lastUpdated) : '데이터 기반 자동 감지'}</span></div>
      <div class="alert-list">
        ${computeSmartAlerts(ib, state.meals, state.workouts).map(a => `
          <div class="alert-item ${a.tone==='warn'?'tone-warn-item':a.tone==='good'?'tone-good-item':''}">
            <div class="alert-icon tone-${a.tone}">${ICONS[a.icon] || ICONS.target}</div>
            <div class="alert-body">
              <div class="alert-title tone-${a.tone}">${a.title}</div>
              <div class="alert-detail">${a.detail}</div>
            </div>
          </div>`).join('')}
      </div>
    </section>

    <section class="card">
      <div class="section-label good">${secNum('00c')}체지방률·골격근량 이동평균 추세 <span class="dim" style="font-weight:500; text-transform:none; letter-spacing:0;">· 단일 측정 노이즈를 걸러낸 MA7/MA14 추세선</span></div>
      <p class="p-dim" style="margin-bottom:14px;">인바디는 하루 컨디션(염분·수분·화장실 여부)에 따라 출렁여요. 실선(MA7)은 단기추세, 점선(MA14)은 더 완만한 장기추세를 보여줘요. 절대값보다 기울기(회귀선) 방향이 더 중요한 지표예요.</p>
      ${(() => {

        const maFat14 = movingAverage(ib, 'fatPct', 14);
        const maMuscle14 = movingAverage(ib, 'muscle', 14);
        const recentFat = maFat.slice(-7), recentMuscle = maMuscle.slice(-7);
        const fatMATrend = recentFat.length>=2 ? recentFat[recentFat.length-1].fatPctMA - recentFat[0].fatPctMA : null;
        const muscleMATrend = recentMuscle.length>=2 ? recentMuscle[recentMuscle.length-1].muscleMA - recentMuscle[0].muscleMA : null;
        const ma_musAssess = computeMuscleAssessment(ib[0], last); // 2026-07-25: 누적(6/5 대비) 비율을 단기 MA 추세와 함께 병기하기 위함

        let insightBlock = '';
        if(fatMATrend!==null && muscleMATrend!==null){
          const fatDown = fatMATrend <= -0.1;
          const muscleUp = muscleMATrend > 0.15;
          const muscleStable = Math.abs(muscleMATrend) <= 0.15;
          const muscleDown = muscleMATrend <= -0.15;
          let tone, title, detail;
          if(fatDown && muscleUp){
            tone='good'; title='체지방 감소 + 골격근량 증가 — 최상의 흐름';

          } else if(fatDown && muscleStable){
            tone='good'; title='이상적인 리컴포지션 패턴';
            detail=`체지방률 이동평균은 ${fmt(Math.abs(fatMATrend),2)}%p 하락했는데, 골격근량 이동평균은 ${fmt(Math.abs(muscleMATrend),2)}kg밖에 안 움직였어요(사실상 변화 없음). 지방만 빠지고 근육은 지켜지는 가장 이상적인 형태예요.`;

            tone='warn'; title='체지방은 감소, 골격근도 같이 감소';
            detail=`체지방률 이동평균 ${fmt(Math.abs(fatMATrend),2)}%p 하락과 함께, 골격근량 이동평균도 ${fmt(Math.abs(muscleMATrend),2)}kg 줄었어요. 단백질 섭취나 저항운동 볼륨을 점검해볼 만해요.`;

            tone='good'; title='골격근량 증가, 체지방은 아직 정체';

          } else if(!fatDown && muscleStable){
            tone='neutral'; title='체지방 추세 정체, 골격근은 안정적';

          }
          // 2026-07-25 추가: 단기(위 MA7 7일변화) 판정에 누적(6/5 대비 비율) 참고와 종합결론을 함께 붙여 표시
          const cumulativeText = ma_musAssess.muscleLoss<=0
            ? ` (누적 참고: 6/5 대비 골격근 감소 없음 — 현재 ${fmt(last.muscle)}kg, 시작값 ${fmt(MUSCLE_BASELINE)}kg)`
            : ma_musAssess.weightLossPct<=0.3
              ? ` (누적 참고: 체중 변화가 아직 적어 비율 계산 의미가 작아요)`

/* 2026-07-21 추가: 대시보드 MA7 추세 섹션 전용 카드 — MA7(실선)+MA14(점선) 오버레이,
   최근 7일 회귀기울기 배지, MA7-MA14 교차 배지를 함께 표시. goodDirection: 'down'이면
   값이 줄어드는 게 좋음(체지방률), 'up'이면 늘거나 유지가 좋음(골격근량) */
function maTrendChartCard(title, ma7data, ma14data, key7, key14, unit, colorVar, goal, goodDirection, slopeDecimals){
  const vals7 = ma7data.map(d=>d[key7]).filter(v=>v!=null);
  const nowVal = vals7[vals7.length-1];
  const recent7 = ma7data.slice(-7).map(d=>d[key7]).filter(v=>v!=null);
  const slope = linRegSlope(recent7);
  const cross = detectCrossover(ma7data, ma14data, key7, key14);

  let slopeBadge = '';
  if(slope!=null){
    const improving = goodDirection==='down' ? slope < -0.001 : slope > 0.001;
    const worsening = goodDirection==='down' ? slope > 0.001 : slope < -0.001;
    const tone = improving ? 'good' : worsening ? 'warn' : 'neutral';
    const toneColor = tone==='good' ? 'var(--c-good)' : tone==='warn' ? 'var(--c-warn)' : 'var(--text-faint)';
    const arrow = slope>0.001 ? '↑' : slope<-0.001 ? '↓' : '→';
    slopeBadge = `<div style="font-size:11px; color:${toneColor}; margin:2px 0 6px;">최근 7일 기울기(회귀) ${arrow} ${slope>=0?'+':''}${fmt(slope,slopeDecimals)}${unit}/day</div>`;
  }
  let crossBadge = '';
  if(cross && cross.daysAgo<=5){
    const upGood = goodDirection==='down' ? cross.direction==='down' : cross.direction==='up';
    const toneColor = upGood ? 'var(--c-good)' : 'var(--c-warn)';
    crossBadge = `<div style="font-size:11px; color:${toneColor}; margin-bottom:6px;">⚡ MA7이 MA14를 ${cross.direction==='up'?'상향':'하향'} 돌파 (${dLabel(cross.date)}, ${cross.daysAgo===0?'오늘':cross.daysAgo+'일 전'})</div>`;
  }

  return `<div class="card chart-card">
    <div class="ch-head"><span class="ch-title">${title}</span><span class="ch-now mono" style="color:var(${colorVar})">${fmt(nowVal)}${unit}</span></div>
    ${slopeBadge}${crossBadge}
    ${lineChartSVGMulti(ma7data, key7, ma14data, key14, colorVar, {goal})}
    <div style="font-size:10px; color:var(--text-faint); margin-top:4px;">
      <span style="color:var(${colorVar})">━ MA7</span>&nbsp;&nbsp;<span style="color:var(${colorVar}); opacity:0.55;">┅ MA14</span>
    </div>
  </div>`;
}
function chartCard(title, data, key, unit, colorVar, goal, vlines){
  const vals = data.map(d=>d[key]).filter(v=>v!=null);
  const nowVal = vals[vals.length-1];
  return `<div class="card chart-card">
    <div class="ch-head"><span class="ch-title">${title}</span><span class="ch-now mono" style="color:var(${colorVar})">${fmt(nowVal)}${unit}</span></div>
    ${lineChartSVG(data, key, colorVar, {goal, vlines})}
  </div>`;
}

function saveEditCell(table, date, field, value){
  const arr = table==='inbody' ? state.inbody : table==='workout' ? state.workouts : state.meals;
  const rec = arr.find(r=>r.date===date);
  if(rec){
    const num = value==='' ? null : Number(value);
    rec[field] = (num===null || isNaN(num)) ? null : num;
    const key = table==='inbody' ? LS_KEYS.inbody : table==='workout' ? LS_KEYS.workout : LS_KEYS.meal;
    saveArr(key, arr);
    markUpdated();
  }
  editingCell = null;
  render();
}
function editableCell(table, date, field, value, decimals){
  const isEditing = editingCell && editingCell.table===table && editingCell.date===date && editingCell.field===field;
  if(isEditing){
    return `<input type="number" step="0.1" value="${value??''}" class="inline-edit-input" data-autofocus="1"
      onblur="saveEditCell('${table}','${date}','${field}',this.value)"
      onkeydown="if(event.key==='Enter'){this.blur();} if(event.key==='Escape'){cancelEditCell();}">`;
  }
  return `<span class="editable-cell" onclick="startEditCell('${table}','${date}','${field}')">${value==null?'—':fmt(value,decimals)}</span>`;

/* ---------- 일별 기록 ---------- */
function renderLog(){
  const byDate = arr => Object.fromEntries(arr.map(r=>[r.date,r]));
  const groupByDate = arr => arr.reduce((acc,r)=>{ (acc[r.date]=acc[r.date]||[]).push(r); return acc; }, {});
  const ib = byDate(state.inbody), wk = groupByDate(state.workouts), ml = byDate(state.meals);
  const dates = [...new Set([...state.inbody.map(r=>r.date), ...state.workouts.map(r=>r.date), ...state.meals.map(r=>r.date)])].sort((a,b)=>b.localeCompare(a));
  if(dates.length===0) return `<div class="empty-state">아직 기록이 없습니다. 상단의 '기록 추가'로 첫 기록을 남겨보세요.</div>`;

  const ibSorted = sortedInbody();
  const prevOf = (date) => { const idx = ibSorted.findIndex(r=>r.date===date); return idx>0 ? ibSorted[idx-1] : null; };

  const weeks = {};
  dates.forEach(d => { const wkKey = isoWeekKey(d); (weeks[wkKey]=weeks[wkKey]||[]).push(d); });
  const weekKeys = Object.keys(weeks).sort((a,b)=>b.localeCompare(a));

  return weekKeys.map(wkKey => {
    const wDates = weeks[wkKey].sort((a,b)=>b.localeCompare(a));
    const wInbody = wDates.map(d=>ib[d]).filter(Boolean);
    const wMeals = wDates.map(d=>ml[d]).filter(Boolean);
    const wWorkouts = wDates.map(d=>wk[d]).filter(Boolean);
    const weightChange = wInbody.length>=2 ? wInbody[0].weight - wInbody[wInbody.length-1].weight : null;
    const avgCal = wMeals.length ? wMeals.reduce((s,m)=>s+(m.calories||0),0)/wMeals.length : null;
    const avgProtein = wMeals.length ? wMeals.reduce((s,m)=>s+(m.protein||0),0)/wMeals.length : null;
    const wkBmr = (wInbody[0] && wInbody[0].bmr) || (sortedInbody().slice(-1)[0] && sortedInbody().slice(-1)[0].bmr);
    const calLow = wkBmr ? Math.round(wkBmr*1.5-550) : null;
    const calHigh = calLow!=null ? calLow+100 : null;
    const calMid = calLow!=null ? (calLow+calHigh)/2 : null;
    const calAchievePct = (avgCal!=null && calMid) ? Math.round(avgCal/calMid*100) : null;
    const proteinMid = (PROTEIN_TARGET.min+PROTEIN_TARGET.max)/2;
    const proteinAchievePct = avgProtein!=null ? Math.round(avgProtein/proteinMid*100) : null;
    const wkStrength = wDates.filter(d => { const t=classifyDayType(state.workouts,d); return t && (t.type==='근력'||t.type==='둘다'); }).length;
    const wkCardio = wDates.filter(d => { const t=classifyDayType(state.workouts,d); return t && (t.type==='유산소'||t.type==='둘다'); }).length;
    const workoutDays = new Set(wDates.filter(d => { const t=classifyDayType(state.workouts,d); return t && t.type!=='휴식'; })).size;
    const endLabel = dLabel(wDates[wDates.length-1]), startLabel = dLabel(wDates[0]);

    return `<div class="week-block">
      <div class="week-head">
        <div class="week-title">${endLabel} – ${startLabel}</div>
        <div class="week-chips">
          ${weightChange!=null ? `<span class="chip ${weightChange<=0?'good':'warn'}">체중 ${weightChange>0?'+':''}${fmt(weightChange)}kg</span>` : ''}
          ${avgCal!=null ? `<span class="chip">평균 칼로리 섭취 ${fmt(avgCal,0)}kcal${calAchievePct!=null?` (달성률 ${calAchievePct}%)`:''}</span>` : ''}
          ${avgProtein!=null ? `<span class="chip">평균 단백질 ${fmt(avgProtein,0)}g${proteinAchievePct!=null?` (달성률 ${proteinAchievePct}%)`:''}</span>` : ''}
          <span class="chip">운동횟수 ${workoutDays}일 (근력 ${Math.round(wkStrength/3*100)}% 달성 ${wkStrength}/3회, 유산소 ${Math.round(wkCardio/3*100)}% 달성 ${wkCardio}/3회)</span>
        </div>
      </div>
      <div class="card" style="padding:4px 16px;">
        ${wDates.map(date => dayRow(date, ib[date], wk[date], ml[date], prevOf(date))).join('')}
      </div>
    </div>`;
  }).join('');
}

function dayRow(date, i, wArr, m, prev){
  const target = i && i.bmr ? Math.round(i.bmr*1.5-550) : null;
  const proteinTarget = PROTEIN_TARGET.min;

  let ibCol = `<span class="empty">기록 없음</span>`;
  if(i){
    const wDelta = prev ? i.weight - prev.weight : null;
    const fDelta = prev ? i.fatPct - prev.fatPct : null;
    ibCol = `체중 <b class="mono">${fmt(i.weight)}kg</b>${deltaSpan(wDelta,'kg')}
      <br>골격근 <b class="mono">${fmt(i.muscle)}kg</b> · 체지방 <b class="mono">${fmt(i.fat)}kg</b>
      <br>체지방률 <b class="mono" style="color:var(--c-fatpct)">${fmt(i.fatPct)}%</b>${deltaSpan(fDelta,'%p')}
      <div class="row-actions"><button class="mini-btn" onclick="editInbodyByDate('${date}')">수정</button><button class="mini-btn danger" onclick="deleteInbodyEntry('${date}')">삭제</button></div>`;
  }
  let wkCol = `<span class="empty">기록 없음</span>`;
  if(wArr && wArr.length){
    wkCol = wArr.map(w => `${esc(w.name)}<br><span class="dim">${esc(w.part)}</span>${w.volume?` · ${esc(w.volume)}`:''}${w.calories?` · ${w.calories}kcal`:''}${w.id?`<div class="row-actions"><button class="mini-btn" onclick="editWorkoutById('${w.id}')">수정</button><button class="mini-btn danger" onclick="deleteWorkoutEntry('${w.id}')">삭제</button></div>`:''}`).join('<hr style="border:none;border-top:1px dashed var(--border);margin:6px 0;">');
  }
  let mlCol = `<span class="empty">기록 없음</span>`;
  if(m){
    const calHit = target ? m.calories<=target+80 : null;
    const proHit = proteinTarget ? m.protein>=proteinTarget : null;
    mlCol = `${m.calories}kcal${target?`<span class="badge ${calHit?'hit':'miss'}">${calHit?'목표 충족':'목표 초과'}</span>`:''}
      <br>단백질 ${m.protein}g${proteinTarget?`<span class="badge ${proHit?'hit':'miss'}">${proHit?'충분':'부족'}</span>`:''}${m.carbs?` · 탄수 ${m.carbs}g`:''}
      ${m.specialDayType?`<br><span class="badge miss">${esc(SPECIAL_DAY_LABELS[m.specialDayType]||m.specialDayType)}</span>`:''}
      ${m.note?`<br><span class="dim">${esc(m.note)}</span>`:''}
      <div class="row-actions"><button class="mini-btn" onclick="editMealByDate('${date}')">수정</button><button class="mini-btn danger" onclick="deleteMealEntry('${date}')">삭제</button></div>`;
  }

  return `<div class="day-row">
    <div class="day-date">${date.slice(5)}<span class="dow">${dowLabel(date)}</span></div>
    <div class="day-cols">
      <div class="day-col"><div class="k">인바디</div>${ibCol}</div>
      <div class="day-col"><div class="k">운동</div>${wkCol}</div>
      <div class="day-col"><div class="k">식단</div>${mlCol}</div>
    </div>
  </div>`;
}
function deltaSpan(delta, unit){
  if(delta===null || delta===undefined || isNaN(delta)) return '';
  if(Math.abs(delta) < 0.05) return `<span class="delta">–</span>`;
  const dir = delta>0 ? 'up' : 'down';
  const arrow = delta>0 ? '▲' : '▼';
  return `<span class="delta ${dir}">${arrow}${fmt(Math.abs(delta), unit==='%p'?2:1)}${unit}</span>`;
}

/* ---------- 목표 ---------- */
function renderGoal(){
  const {last, ma} = computeInsights();
  if(!last) return `<div class="empty-state">아직 기록이 없습니다.</div>`;
  const recentMA = ma.slice(-7);
  const maTrendDelta = recentMA.length>=2 ? recentMA[recentMA.length-1].fatPctMA - recentMA[0].fatPctMA : 0;
  const first = sortedInbody()[0];
  const muscleAssess = computeMuscleAssessment(first, last);

  const other = last.weight - last.muscle - last.fat;
  const targetMuscle = Math.max(last.muscle, MUSCLE_BASELINE);

  const calcRows = FAT_GOALS.map(g => {
    const t = g.pct/100;
    const targetFat = t*(other+targetMuscle) / (1-t);
    const targetWeight = other + targetMuscle + targetFat;
    const fatLossNeeded = last.fat - targetFat;
    const muscleGainNeeded = targetMuscle - last.muscle;
    const achieved = last.fatPct <= g.pct;
    return {g, targetFat, targetWeight, targetMuscle, fatLossNeeded, muscleGainNeeded, achieved, basisLabel:'회복 기준'};
  });
  // [2026-07-19 추가] 인바디를 매일 측정하므로, 골격근이 회복 기준값(33.2kg)까지 오른다고
  // 가정하지 않고 "오늘 실측 골격근량 그대로 유지"된다는 보수적 가정으로도 1차/2차 목표에
  // 필요한 체지방 감량을 별도로 계산해서 함께 보여줌 (요청: 매일 실측 골격근량 기준 계산 추가).
  const calcRowsCurrent = FAT_GOALS.map(g => {
    const t = g.pct/100;
    const tm = last.muscle; // 오늘 실측 골격근량 고정(회복 가정 없음)
    const targetFat = t*(other+tm) / (1-t);
    const targetWeight = other + tm + targetFat;
    const fatLossNeeded = last.fat - targetFat;
    const achieved = last.fatPct <= g.pct;
    return {g, targetFat, targetWeight, targetMuscle:tm, fatLossNeeded, muscleGainNeeded:0, achieved, basisLabel:'오늘 실측 골격근 기준'};
  });

  return `
    <section class="card">
      <div class="section-label good">${secNum('03')}목표 현황</div>
      <h3 class="hero-heading">체지방률 ${fmt(START_FAT_PCT)}% → 현재 ${fmt(last.fatPct)}%</h3>
      <div class="ring-grid">
        ${calcRowsCurrent.map(r => {
          const totalFatToLose = Math.max(0.0001, first.fat - r.targetFat);
          const achievedSoFar = first.fat - last.fat;
          const progressed = r.achieved ? 100 : Math.min(100, Math.max(0, (achievedSoFar/totalFatToLose)*100));
          return `<div class="ring-card">
            ${ringSVG(progressed, r.achieved)}
            <div class="ring-label">${r.g.label} · ${r.g.pct}%</div>
            <div class="ring-status ${r.achieved?'done':'pending'}">
              ${r.achieved ? '달성 완료' : `체지방 ${fmt(r.fatLossNeeded)}kg 감소 필요`}
            </div>
          </div>`;
        }).join('')}
      </div>
      <div class="note-box" style="margin-top:14px;">
        체중감량 대비 골격근 손실 비율(SURMOUNT-1 0.51 기준) 판단은 아래 가이드 02번과 대시보드를 함께 참고하세요.
      </div>
    </section>

    <section class="card">
      <div class="section-label">${secNum('04')}목표 달성에 필요한 변화량 (추정)</div>
      <div style="overflow-x:auto;">
        <table class="data-table calc-table">
          <thead><tr><th style="text-align:left">목표</th><th>기준</th><th>목표 체지방률</th><th>필요 체지방 감량</th><th>필요 골격근량</th><th>골격근 증가분</th><th>예상 목표체중</th></tr></thead>
          <tbody>
            ${[...calcRows, ...calcRowsCurrent].map(r => `<tr>
              <td>${r.g.label}</td>
              <td class="dim">${r.basisLabel}</td>
              <td>${r.g.pct}%</td>
              <td class="warn-text">${r.achieved?'<span style="font-family:var(--font-body)">달성</span>':`-${fmt(r.fatLossNeeded)}kg`}</td>
              <td>${fmt(r.targetMuscle)}kg</td>
              <td class="good-text">${r.muscleGainNeeded>0.05?`+${fmt(r.muscleGainNeeded)}kg`:'<span style="font-family:var(--font-body)">현 수준 유지</span>'}</td>
              <td>${fmt(r.targetWeight)}kg</td>
            </tr>`).join('')}
          </tbody>
        </table>
      </div>
      <div class="note-box" style="margin-top:14px;">
        추정 방식: 골격근량 외 신체 구성요소(뼈·장기 등, 현재 약 ${fmt(other)}kg)는 그대로 유지된다고 가정합니다. <b>"회복 기준" 행</b>은 골격근량이 시작 기준값(${MUSCLE_BASELINE}kg) 이상으로 회복된다고 가정한 계산이고, <b>"오늘 실측 골격근 기준" 행</b>은 매일 측정하는 오늘자 골격근 실측치(${fmt(last.muscle)}kg)가 그대로 유지된다는 보수적 가정으로 계산해 필요 체지방 감량을 역산했습니다. 골격근이 실제로 늘면 "오늘 실측 기준" 행의 필요 감량치는 인바디 측정마다 갱신되어 줄어듭니다. 실제 InBody 측정치는 수분 상태 등에 따라 오차가 있을 수 있습니다.
      </div>
    </section>

    <section class="card">
      <div class="section-label good">${secNum('04b')}허리둘레 추적</div>
      <p class="p-dim">체지방이 줄어도 복부는 가장 늦게 반영되는 경우가 많아, 인바디와 별도로 허리둘레 추이를 함께 기록하면 판단에 도움이 됩니다. 같은 조건(아침 공복, 같은 위치·줄자)에서 측정해주세요 — 하루 1~3cm 변동은 자연스러운 범위입니다.</p>
      <div style="display:flex; gap:8px; align-items:center; flex-wrap:wrap; margin:12px 0;">
        <input type="date" id="waistDateInput" value="${todayISO()}" style="padding:8px 10px; border-radius:8px; border:1px solid var(--border); font-family:var(--font-body); color:var(--text);">
        <input type="number" step="0.1" id="waistValueInput" placeholder="cm" style="width:80px; padding:8px 10px; border-radius:8px; border:1px solid var(--border); font-family:var(--font-mono); color:var(--text);">
        <button onclick="addWaistEntry()" class="btn-primary" style="padding:8px 18px; border-radius:8px; border:none; background:var(--c-waist); color:#fff; font-weight:600; cursor:pointer;">추가</button>
      </div>
      ${state.waist.length ? chartCard('허리둘레', [...state.waist].sort((a,b)=>a.date.localeCompare(b.date)), 'waist', 'cm', '--c-waist', null, null) : `<div class="empty-state">아직 기록된 허리둘레가 없어요. 위에서 날짜와 cm를 입력해 추가해보세요.</div>`}
      ${state.waist.length ? `<div style="overflow-x:auto; margin-top:12px;">
        <table class="data-table">
          <thead><tr><th style="text-align:left">날짜</th><th>허리둘레</th><th></th></tr></thead>
          <tbody>
            ${[...state.waist].sort((a,b)=>b.date.localeCompare(a.date)).map(w => `<tr>
              <td>${w.date}</td>
              <td>${fmt(w.waist)}cm</td>
              <td><button onclick="deleteWaistEntry('${w.date}')" style="background:none; border:none; color:var(--text-faint); cursor:pointer; font-family:var(--font-body); font-size:12px;">삭제</button></td>
            </tr>`).join('')}
          </tbody>
        </table>
      </div>` : ''}
      <div class="note-box" style="margin-top:14px;">
        <!-- 2026-08-13 확인: 클라이언트(cloudSync)는 이미 waist를 push/pull 요청에 포함해서
             보내고 있음(mergeByDate_·recentWindow_ 모두 적용됨) — 다만 Google Apps Script
             (Code.gs)가 이 waist 키를 실제로 시트에 쓰고/읽어주는지는 이 세션에서 Code.gs
             원본이 없어 확인 불가. "요청을 보냈다"와 "서버가 실제로 처리한다"는 다른 얘기라
             문구를 사실 그대로 정정함(행위≠결과확인 원칙). -->
        허리둘레는 앱이 다른 기록과 함께 클라우드로 보내려고는 하지만, <b>Google Apps Script(Code.gs)가 이 항목을 처리하도록 돼있는지는 아직 확인되지 않았습니다.</b> Code.gs에 Waist 시트 처리가 없다면 실제로는 이 기기에만 남아있는 상태일 수 있어요. 다른 기기에서도 같이 보시려면 Code.gs 파일을 다음 채팅에 올려주세요 — 필요한 부분을 확인해서 채워드릴게요.
      </div>
    </section>

    <section class="card">
      <div class="section-label good">${secNum('05')}추천 가이드</div>
      <div class="guide-list">
        ${(() => {
          const targetLow = Math.round(last.bmr*1.5-550), targetHigh = targetLow+100;
          const midCal = Math.round((targetLow+targetHigh)/2);
          const proteinMid = Math.round((PROTEIN_TARGET.min+PROTEIN_TARGET.max)/2);
          const proteinKcal = proteinMid*4;
          const remainKcal = midCal - proteinKcal;
          const carbG = Math.round(remainKcal*0.55/4);
          const fatG = Math.round(remainKcal*0.45/9);
          return `<div class="guide-item"><span class="guide-num">01</span>칼로리 목표 = 최신 BMR × 1.5 − 550kcal 공식을 유지하세요. 현재 BMR ${last.bmr}kcal 기준 <b>${targetLow}~${targetHigh}kcal</b>가 권장 범위예요. 매크로는 단백질 ${PROTEIN_TARGET.min}~${PROTEIN_TARGET.max}g 기준으로 잡으면 대략 <b>단백질 ${proteinMid}g · 탄수화물 ${carbG}g · 지방 ${fatG}g</b>(약 ${midCal}kcal)이 기준값이에요.</div>`;
        })()}
        <div class="guide-item"><span class="guide-num">02</span>tirzepatide DEXA 임상연구(SURMOUNT-1, Look et al. 2025, Diabetes Obes Metab)의 실측치로 계산하면 체중 -21.3% 대비 제지방량 -10.9%, 비율 0.51이에요. 지금 정희님의 골격근 비율은 ${muscleAssess.muscleLoss<=0 ? '0 (감소 없음)' : fmt(muscleAssess.ratio,2)}로 ${muscleAssess.tone==='good' ? '0.51보다 뚜렷이 낮아 근육을 잘 보존하고 있어요' : muscleAssess.tone==='neutral' ? '0.51 이내로 임상 기준 범위 안이에요' : '0.51을 넘어 저항운동 볼륨과 단백질 섭취를 점검할 필요가 있어요'}. 이 비율을 0.51 아래로 유지하는 게 목표예요.</div>
        <div class="guide-item"><span class="guide-num">03</span>체지방률의 일일 변화는 BIA 특성상 수분·글리코겐 상태에 따라 흔들릴 수 있습니다. 하루 단위 반등에 일희일비하지 말고 7일 이동평균으로 추세를 판단하세요. 현재 추세는 ${maTrendDelta<=0?'하락(개선) 중':'상승(정체) 중'}입니다.</div>
        <div class="guide-item"><span class="guide-num">04</span>단백질은 하루 <b>${PROTEIN_TARGET.min}~${PROTEIN_TARGET.max}g</b>을 목표로 하세요(체중×1.6g/kg 기준에서 상향 조정됨). 총 칼로리가 같다면 탄수화물·지방 비율 자체는 지방감량에 큰 영향이 없지만(Hall et al. 2015), 단백질을 이 범위로 올리면 포만감·근손실 방어·식이성 발열효과 측면에서 유리해요.</div>
      </div>
    </section>
  `;
}
function ringSVG(pct, done){
  const r=42, c=2*Math.PI*r, off = c*(1-pct/100);
  const gid = 'ring'+Math.random().toString(36).slice(2,7);
  return `<svg width="110" height="110" viewBox="0 0 110 110">
    <defs><linearGradient id="${gid}" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" style="stop-color:var(--c-ring-from)"/>
      <stop offset="100%" style="stop-color:${done?'var(--c-ring-good)':'var(--c-ring-warn)'}"/>
    </linearGradient></defs>
    <circle cx="55" cy="55" r="${r}" fill="none" style="stroke:var(--c-track)" stroke-width="10"/>
    <circle cx="55" cy="55" r="${r}" fill="none" stroke="url(#${gid})" stroke-width="10" stroke-linecap="round"
      stroke-dasharray="${c}" stroke-dashoffset="${off}" transform="rotate(-90 55 55)"/>
    <text x="55" y="60" text-anchor="middle" class="ring-num" font-size="18">${Math.round(pct)}%</text>
  </svg>`;
}

/* ---------- 설정 ---------- */
/* =========================================================
   리포트 탭 (2026-08-04 신설)
   - 6/5(다이어트 시작) 이후 전체기간을 대상으로 한 "정기 종합 리포트".
   - 매일 갱신되는 대시보드 "Claude 분석"(aiNote)과는 별개로, 여기 있는 수치 요약은
     매번 클라이언트에서 실측 데이터로 직접 계산해 항상 최신 상태를 반영한다(별도 업로드 불필요).
   - 하단 "Claude 종합 리포트" 텍스트 영역은 aiNote와 동일한 패턴(붙여넣기 저장/클라우드 동기화)으로,
     Claude가 정기적으로 작성하는 서술형 총평을 담기 위한 별도 저장소(reportNote)다.
========================================================= */
function renderReport(){
  const ib = sortedInbody();
  if(!ib.length){
    return `<section class="card"><div class="section-label good">${secNum('07a')}종합 리포트</div><p class="p-dim">인바디 데이터가 없어 리포트를 생성할 수 없어요.</p></section>`;
  }
  const first = ib[0], last = ib[ib.length-1];
  const totalDays = Math.round((new Date(last.date+'T00:00:00')-new Date(first.date+'T00:00:00'))/86400000);
  const assess = computeMuscleAssessment(first, last);

  // 최근 14일 vs 그 이전 14일 — MA7 스냅샷 기준 골격근/체지방 "절대 감소량" 비교
  // (사용자가 "최근 체지방 대비 골격근이 더 빠지는 느낌"을 데이터로 확인하기 위함)
  const priorDate = (() => { const d = new Date(last.date+'T00:00:00'); d.setDate(d.getDate()-14); return toLocalISO(d); })();
  const priorPriorDate = (() => { const d = new Date(last.date+'T00:00:00'); d.setDate(d.getDate()-28); return toLocalISO(d); })();
  const recentSnap = ma7SnapshotAt(ib, last.date, ['muscle','fat']);
  const priorSnap = ma7SnapshotAt(ib, priorDate, ['muscle','fat']);
  const priorPriorSnap = ma7SnapshotAt(ib, priorPriorDate, ['muscle','fat']);
  const muscleRecentDelta = (recentSnap && priorSnap) ? recentSnap.muscle - priorSnap.muscle : null;
  const fatRecentDelta = (recentSnap && priorSnap) ? recentSnap.fat - priorSnap.fat : null;
  const musclePriorDelta = (priorSnap && priorPriorSnap) ? priorSnap.muscle - priorPriorSnap.muscle : null;
  const fatPriorDelta = (priorSnap && priorPriorSnap) ? priorSnap.fat - priorPriorSnap.fat : null;

  // 운동 준수 요약 (전체기간)
  const strengthSessions = state.workouts.filter(w => inferPartsForEntry(w).some(p=>BODY_PARTS.includes(p))).length;
  const cardioEntries = state.workouts.filter(w => (w.part||'').includes('유산소') || isInclineEntry(w) || /자전거|사이클/.test(`${w.name||''} ${w.note||''}`));
  const cardioWithHR = cardioEntries.map(w=>({date:w.date, hr:parseHR(`${w.name||''} ${w.note||''}`)})).filter(x=>x.hr!==null);
  const cardioInZone = cardioWithHR.filter(x=>x.hr>=CARDIO_HR_TARGET.min && x.hr<=CARDIO_HR_TARGET.max).length;
  const cardioZoneRate = cardioWithHR.length ? Math.round(cardioInZone/cardioWithHR.length*100) : null;

  // 식단 요약 (최근 14일)
  const mealCutoff = (() => { const d = new Date(todayISO()+'T00:00:00'); d.setDate(d.getDate()-14); return toLocalISO(d); })();
  const recentMeals = state.meals.filter(m=>m.date>=mealCutoff);
  const avgCal = recentMeals.length ? Math.round(recentMeals.reduce((s,m)=>s+(m.calories||0),0)/recentMeals.length) : null;
  const avgProt = recentMeals.length ? Math.round(recentMeals.reduce((s,m)=>s+(m.protein||0),0)/recentMeals.length) : null;
  const avgCarb = recentMeals.length ? Math.round(recentMeals.reduce((s,m)=>s+(m.carbs||0),0)/recentMeals.length) : null;

  const deltaRow = (label, sVal, eVal, unit, goodDir) => {
    const delta = eVal - sVal;
    const good = goodDir==='down' ? delta<=0 : delta>=0;
    return `<tr><td style="text-align:left; font-family:var(--font-body);">${label}</td><td>${fmt(sVal,1)}${unit}</td><td>${fmt(eVal,1)}${unit}</td>
      <td style="color:${good?'var(--c-good, #3ecf8e)':'var(--c-warn, #ffb648)'}">${delta>0?'+':''}${fmt(delta,1)}${unit}</td></tr>`;
  };

  return `
    <section class="card">
      <div class="section-label good" style="display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:8px;">
        <span>${secNum('07a')}종합 리포트 <span class="dim" style="font-weight:500; text-transform:none; letter-spacing:0;">· ${first.date} ~ ${last.date} (${totalDays}일)</span></span>
        <span class="btn-row no-print">
          <button class="btn btn-sm" onclick="copyReportText()">📋 텍스트로 복사</button>
          <button class="btn btn-sm" onclick="printReport()">🖨 인쇄/PDF로 저장</button>
        </span>
      </div>
      <div id="report-copy-status" style="font-size:11.5px; color:var(--c-good); margin-top:-6px; margin-bottom:10px; opacity:0; transition:opacity .3s;">복사됨</div>
      <p class="p-dim">다이어트 시작(${first.date}) 이후 전체 기간의 데이터를 실측 기준으로 자동 집계한 리포트예요. 화면을 열 때마다 최신 동기화 데이터로 다시 계산돼요. "텍스트로 복사"를 누르면 Claude 채팅에 바로 붙여넣기 좋은 형태로 클립보드에 담겨요.</p>
      <table class="data-table" style="margin-top:12px;">
        <thead><tr><th style="text-align:left">지표</th><th>시작값(${first.date})</th><th>최신값(${last.date})</th><th>변화</th></tr></thead>
        <tbody>
          ${deltaRow('체중','weight' in first?first.weight:null, last.weight,'kg','down')}
          ${deltaRow('골격근량', first.muscle, last.muscle, 'kg', 'up')}
          ${deltaRow('체지방량', first.fat, last.fat, 'kg', 'down')}
          ${deltaRow('체지방률', first.fatPct, last.fatPct, '%', 'down')}
        </tbody>
      </table>
    </section>

    <section class="card">
      <div class="section-label good">${secNum('07b')}골격근 손실 비율 평가</div>
      <p class="p-dim">
        전체기간 골격근 손실비율(%골격근감소 ÷ %체중감소) = <b>${fmt(assess.muscleLossPct,1)}% ÷ ${fmt(assess.weightLossPct,1)}% = ${assess.ratio!==null?fmt(assess.ratio,2):'—'}</b>
        (SURMOUNT-1 DEXA 하위연구 제지방량 기준 0.51을 상한선 참고치로 사용 — <b>${assess.label}</b>)
      </p>
      <div class="note-box" style="margin-top:10px;">
        ⚠️ 이 0.51은 임상시험에서 <b>제지방량(근육+수분+장기+뼈)</b> 기준 DEXA 실측치이며, 정희님 데이터는 InBody(BIA) <b>골격근량</b> 기준이라 측정방식·지표범위가 다릅니다.

function clearReportNote(){

/* =========================================================
   클립보드 복사 / 인쇄 (2026-08-13 추가)
   이 프로젝트의 실제 운영 방식은 "앱에서 데이터 확인 → Claude 채팅에 옮겨서 분석 요청 →
   결과를 다시 앱에 붙여넣기"인데, 정작 앱 안에는 클립보드 복사 기능이 전혀 없어서 매번
   화면을 보고 손으로 옮겨 적어야 했음. 여기서는 그 왕복에서 가장 자주 쓰일 두 가지
   (종합 리포트, 오늘 하루 요약)를 텍스트로 복사하는 기능만 우선 추가함.
========================================================= */
function buildReportCopyText(){
  const ib = sortedInbody();
  if(!ib.length) return '아직 인바디 데이터가 없어 리포트를 만들 수 없어요.';
  const first = ib[0], last = ib[ib.length-1];
  const totalDays = Math.round((new Date(last.date+'T00:00:00')-new Date(first.date+'T00:00:00'))/86400000);
  const assess = computeMuscleAssessment(first, last);
  const mealCutoff = (() => { const d = new Date(todayISO()+'T00:00:00'); d.setDate(d.getDate()-14); return toLocalISO(d); })();
  const recentMeals = state.meals.filter(m=>m.date>=mealCutoff);
  const avgCal = recentMeals.length ? Math.round(recentMeals.reduce((s,m)=>s+(m.calories||0),0)/recentMeals.length) : null;
  const avgProt = recentMeals.length ? Math.round(recentMeals.reduce((s,m)=>s+(m.protein||0),0)/recentMeals.length) : null;
  const avgCarb = recentMeals.length ? Math.round(recentMeals.reduce((s,m)=>s+(m.carbs||0),0)/recentMeals.length) : null;
  const strengthSessions = state.workouts.filter(w => inferPartsForEntry(w).some(p=>BODY_PARTS.includes(p))).length;
  const latestDose = state.mounjaroDoses[state.mounjaroDoses.length-1];

  const lines = [];
  lines.push(`[바디 리컴포지션 종합 리포트] ${first.date} ~ ${last.date} (${totalDays}일)`);
  lines.push(`체중 ${fmt(first.weight)}kg → ${fmt(last.weight)}kg (${fmt(last.weight-first.weight,1)}kg)`);
  lines.push(`골격근량 ${fmt(first.muscle)}kg → ${fmt(last.muscle)}kg (${fmt(last.muscle-first.muscle,1)}kg)`);
  lines.push(`체지방량 ${fmt(first.fat)}kg → ${fmt(last.fat)}kg (${fmt(last.fat-first.fat,1)}kg)`);
  lines.push(`체지방률 ${fmt(first.fatPct)}% → ${fmt(last.fatPct)}% (${fmt(last.fatPct-first.fatPct,1)}%p)`);
  lines.push(`골격근 손실비율(SURMOUNT-1 0.51 기준 참고): ${assess.ratio!==null?fmt(assess.ratio,2):'—'} — ${assess.label}`);
  lines.push(`전체기간 근력 세션 수: ${strengthSessions}회`);
  if(avgCal!==null) lines.push(`최근 14일 평균 섭취: 칼로리 ${avgCal}kcal / 단백질 ${avgProt}g / 탄수화물 ${avgCarb}g`);
  if(latestDose) lines.push(`마운자로: ${latestDose.cycle}차(${latestDose.date}, ${latestDose.dose}) 완료`);
  if(state.reportNote) lines.push(`\n[직전 Claude 종합 리포트 메모]\n${state.reportNote.text}`);
  lines.push(`\n(바디 리컴포지션 앱에서 자동 생성 · ${todayISO()})`);
  return lines.join('\n');
}
function buildTodayCopyText(){
  const d = todayISO();
  const ib = state.inbody.find(r=>r.date===d);
  const meal = state.meals.find(m=>m.date===d);
  const workouts = state.workouts.filter(w=>w.date===d);
  const lines = [`[오늘(${d}) 데이터 요약]`];
  lines.push(ib ? `인바디: 체중 ${fmt(ib.weight)}kg · 골격근 ${fmt(ib.muscle)}kg · 체지방 ${fmt(ib.fat)}kg(${fmt(ib.fatPct)}%) · BMR ${ib.bmr??'—'}kcal` : '인바디: 오늘 기록 없음');
  lines.push(meal ? `식단: ${meal.calories}kcal · 단백질 ${meal.protein}g${meal.carbs?` · 탄수 ${meal.carbs}g`:''}${meal.specialDayType&&meal.specialDayType!=='none'?` · 특이일:${SPECIAL_DAY_LABELS[meal.specialDayType]}`:''}${meal.note?` · ${meal.note}`:''}` : '식단: 오늘 기록 없음');
  if(workouts.length){
    workouts.forEach(w => lines.push(`운동: ${w.name}${w.part?` (${w.part})`:''}${w.volume?` · ${w.volume}`:''}${w.calories?` · ${w.calories}kcal`:''}`));
  } else {
    lines.push('운동: 오늘 기록 없음');
  }
  lines.push(`(바디 리컴포지션 앱에서 자동 생성 · ${todayISO()})`);
  return lines.join('\n');
}
async function copyTextToClipboard(text, statusElId, successMsg){
  try{
    await navigator.clipboard.writeText(text);
    flashCopyStatus(statusElId, successMsg || '복사됐어요!');
  }catch(e){
    // 클립보드 API가 막혀있는 환경(권한 거부 등) 대비 폴백 — 텍스트를 보여줘서 수동 복사 가능하게 함
    prompt('자동 복사가 안 됐어요. 아래 텍스트를 직접 복사하세요:', text);
  }
}
function flashCopyStatus(elId, msg){
  const el = document.getElementById(elId);
  if(!el) return;
  el.textContent = msg;
  el.style.opacity = '1';
  clearTimeout(el._hideTimer);
  el._hideTimer = setTimeout(()=>{ el.style.opacity='0'; }, 2500);
}
function copyReportText(){ copyTextToClipboard(buildReportCopyText(), 'report-copy-status', '복사됐어요! Claude 채팅에 붙여넣으세요.'); }
function copyTodayText(){ copyTextToClipboard(buildTodayCopyText(), 'today-copy-status', '복사됐어요! Claude 채팅에 붙여넣으세요.'); }
function printReport(){ window.print(); }

// 2026-07-26 근본 수정: 기존 병합 함수들은 서버(incoming) 데이터를 "추가/갱신"만 하고
// 로컬에만 남아있는 레코드는 절대 지우지 않는 구조였음. 이 앱은 Google Sheet가 유일한
// 진실 공급원(source of truth)이므로, incoming(서버)에 데이터가 존재하는 "날짜"에 한해서는
// 로컬의 해당 날짜 기존 레코드를 전부 버리고 서버 데이터로 완전히 교체한다.
// (서버에서 삭제된 레코드가 로컬 캐시에 영구히 남아, 동기화할 때마다 다시 서버로
// 재업로드되어 되살아나는 버그의 근본 원인이었음 — 2026-07-26 실제 발생·발견)
// incoming에 없는 날짜(아직 서버에 한 번도 안 올라간 로컬 전용 데이터)는 그대로 보존.
function mergeByDate_(existing, incoming){
  if(!incoming || !incoming.length) return existing;
  const incomingDates = new Set(incoming.map(r=>r.date));
  const kept = existing.filter(r => !incomingDates.has(r.date));
  return [...kept, ...incoming];
}
// 운동은 하루에 여러 건이 정상(예: 근력+유산소, 유산소 2회)이라 날짜만으로 병합하면 안 되지만,
// "해당 날짜에 서버 데이터가 있으면 그 날짜의 로컬 레코드는 전부 서버 것으로 교체"하는 원칙은 동일.
function mergeWorkoutsByDate_(existing, incoming){
  if(!incoming || !incoming.length) return existing;
  const incomingDates = new Set(incoming.map(r=>r.date));
  const kept = existing.filter(r => !incomingDates.has(r.date));
  return [...kept, ...incoming];
}
// 2026-07-16 추가: 식단도 운동처럼 하루 여러 건이 정상(아침/점심/저녁/간식). 마찬가지로
// "해당 날짜에 서버 데이터가 있으면 그 날짜의 로컬 레코드는 전부 서버 것으로 교체".
function mergeMealsByDate_(existing, incoming){
  if(!incoming || !incoming.length) return existing;
  const incomingDates = new Set(incoming.map(r=>r.date));
  const kept = existing.filter(r => !incomingDates.has(r.date));
  return [...kept, ...incoming];
}

let syncTimerHandle = null;
function startSyncTimer(){
  clearInterval(syncTimerHandle);
  syncTimerHandle = setInterval(() => {
    if(syncUiStatus.phase!=='syncing'){ clearInterval(syncTimerHandle); syncTimerHandle=null; return; }

// 2026-07-17 추가: Apps Script 응답이 느리거나 응답 자체가 없을 때 무한정 매달리지 않도록 타임아웃 부여.
// 타임아웃 시 명확한 에러로 실패 처리(조용히 멈춰있지 않도록).
async function fetchWithTimeout(url, opts, timeoutMs){
  const controller = new AbortController();
  const timer = setTimeout(() => controller.abort(), timeoutMs);
  try{
    return await fetch(url, {...(opts||{}), signal: controller.signal});
  }catch(e){
    if(e && e.name === 'AbortError'){
      const err = new Error(`서버 응답이 ${Math.round(timeoutMs/1000)}초 넘게 없어 시간 초과됐어요. 네트워크 상태를 확인하거나 잠시 후 다시 시도해주세요.`);
      err.isTimeout = true;
      throw err;
    }
    throw e;
  } finally { clearTimeout(timer); }
}

// 매번 전체 이력을 다 보내지 않고 "최근 N일치 + 오늘 하루 앱 내 직접 수정분"만 전송해 페이로드를

// 방식을 계속 사용(이 최적화와 무관하게 항상 가능).
const SYNC_RECENT_DAYS = 14;
function recentWindow_(arr){
  const cutoff = new Date(); cutoff.setDate(cutoff.getDate() - SYNC_RECENT_DAYS);
  const cutoffStr = toLocalISO(cutoff);
  return (arr||[]).filter(r => r.date >= cutoffStr);
}

      // 시트엔 반영 안 됨" 버그의 직접 원인이었음(2026-08-12 실제 발생·발견).
      // (1) HTTP 상태코드 확인 → (2) 곧바로 재조회(GET)해서 방금 보낸 인바디 날짜가 실제로
      // 서버(시트)에 존재하는지까지 재검증한 뒤에만 '완료'로 표시한다.
      if(!postRes_.ok){
        throw new Error(`서버가 업로드를 거부했습니다(HTTP ${postRes_.status}). Apps Script 배포 상태를 확인해주세요.`);
      }
      if(pushedInbodyDates_.length){
        const verifyRes_ = await fetchWithTimeout(url + (url.includes('?') ? '&' : '?') + 'ts=' + Date.now(), {}, SYNC_TIMEOUT_MS);
        const verifyData_ = await verifyRes_.json();
        const serverDates_ = new Set((verifyData_.inbody||[]).map(r=>r.date));
        const missing_ = pushedInbodyDates_.filter(d => !serverDates_.has(d));
        if(missing_.length){
          throw new Error(`인바디 ${missing_.join(', ')} 데이터가 서버(시트)에 반영되지 않았습니다. 다시 동기화하거나 Apps Script 배포 상태를 확인해주세요.`);
        }
      }
      markUpdated();
      stopSyncTimer();
      try{ localStorage.setItem(LS_KEYS.lastautosync, new Date().toISOString()); }catch(e){} // 2026-08-04 추가: 스로틀 판단용
      syncUiStatus = {phase:'done', at: new Date().toISOString()}; // 2026-08-04: 자동 동기화도 배너로 보여야 하므로 항상 설정
      render(); // 데이터가 실제로 바뀌었으니 여기서는 전체 재구성이 맞음(마지막 갱신 시각 등도 갱신)
    } finally { syncing = false; stopSyncTimer(); }
  }catch(e){
    // render() 등 예상 못한 곳에서 예외가 나도 조용히 묻히지 않고 반드시 사용자에게 보이도록 함
    // (alert는 render 실패와 무관하게 항상 뜸).
    syncing = false;
    stopSyncTimer();
    console.error('cloudSync error', e);
    // 2026-08-04: 자동 동기화 실패도(예: 오프라인) 배너로 알려야 하므로 상태 갱신은 항상 시도.
    // 다만 paintSyncBadge 자체가 실패하는 예외적 상황의 raw alert() 폴백만 silent일 때 억제
    // (자동 백그라운드 동기화 중에 갑자기 alert 팝업이 뜨는 건 사용자 경험상 피해야 함).
    try{
      syncUiStatus = {phase:'error', at: new Date().toISOString(), message: (e && e.isTimeout) ? e.message : ('동기화 실패: ' + (e && e.message ? e.message : '알 수 없는 오류'))};
      paintSyncBadge();
    }catch(e2){
      if(!silent) alert('동기화 중 오류가 발생했습니다: ' + (e && e.message ? e.message : e));
    }
  }
}

function setKind(k){ modalState.kind=k; modalState.status='idle'; modalState.form={date:todayISO()}; modalState.error=''; modalState.exerciseRows = k==='workout' ? [{}] : []; modalState.workoutJsonText=''; refreshModal(); }
function setManual(){ modalState.status='manual'; modalState.form={date:todayISO()}; if(modalState.kind==='workout' && !modalState.exerciseRows) modalState.exerciseRows=[{}]; refreshModal(); }
function addExRow(){ modalState.exerciseRows = modalState.exerciseRows||[]; modalState.exerciseRows.push({}); refreshModal(); }
function removeExRow(i){ modalState.exerciseRows.splice(i,1); refreshModal(); }
function updateExRow(i,field,val){ modalState.exerciseRows[i][field] = val; }
function refreshModal(){ document.getElementById('modal-backdrop')?.remove(); renderModal(); }

async function handleFile(file){
  if(!file) return;
  if(!localStorage.getItem(LS_KEYS.apikey)){
    modalState.status='manual'; modalState.error='사진 자동 인식은 지원하지 않아요. 아래에 값을 직접 입력해주세요.'; modalState.form={date:todayISO()};
    refreshModal(); return;
  }
  modalState.status='loading'; refreshModal();
  try{
    const base64 = await fileToBase64(file);
    const result = await recognizeImage(base64, file.type||'image/jpeg', modalState.kind);
    modalState.form = {date: result.date || todayISO(), ...result};
    modalState.status='review'; modalState.error='';
  }catch(e){
    modalState.status='manual'; modalState.error='이미지 인식에 실패했습니다. 값을 직접 입력해주세요.'; modalState.form={date:todayISO()};
  }
  refreshModal();
}

function saveRecord(){
  const f = modalState.form;
  if(!f.date){ alert('날짜를 입력해주세요.'); return; }
  if(modalState.kind==='inbody'){
    const rec = {date:f.date, weight:num(f.weight), muscle:num(f.muscle), fat:num(f.fat), fatPct:num(f.fatPct), bmr:f.bmr?num(f.bmr):null};
    state.inbody = [...state.inbody.filter(r=>r.date!==rec.date), rec];
    saveArr(LS_KEYS.inbody, state.inbody);
  } else if(modalState.kind==='meal'){
    // 2026-08-13 추가: 특이일 유형(과식/음주/컨디션난조/외식 등) — 기존엔 note 자유텍스트의
    // 키워드 매칭에만 의존해 음주 등은 아예 감지가 안 됐음(computeSmartAlerts의
    // SPECIAL_DAY_KEYWORDS 참고). 이제 구조화된 필드로 명시적으로 남긴다.
    const rec = {date:f.date, calories:num(f.calories), protein:num(f.protein), carbs:f.carbs?num(f.carbs):null, note:f.description||f.note||'', specialDayType: f.specialDayType||null};
    state.meals = [...state.meals.filter(r=>r.date!==rec.date), rec];
    saveArr(LS_KEYS.meal, state.meals);
  } else {
    const validRows = (modalState.exerciseRows||[]).filter(r => r.name && r.name.trim());
    let rec;
    const existingId = modalState.editId || null;
    if(validRows.length){
      const exercises = validRows.map(r => ({
        name:r.name.trim(), part:r.part||inferPartFromName(r.name), sets:num(r.sets), reps:num(r.reps), weight:num(r.weight)
      }));
      const totalVol = exercises.reduce((s,e)=> s + ((e.weight||0)*(e.sets||0)*(e.reps||0)), 0);
      const parts = [...new Set(exercises.map(e=>e.part).filter(Boolean))];
      rec = {
        id: existingId || makeId('w'),
        date:f.date,
        name: exercises.map(e=>e.name).join(' / '),
        part: parts.join('+') || (f.part||''),
        volume: totalVol>0 ? `${totalVol.toLocaleString()}kg` : (f.volume||null),
        calories: f.calories?num(f.calories):null,
        note: f.note||'',
        treadmillSteps: f.treadmillSteps?num(f.treadmillSteps):null,
        exercises
      };
    } else {
      rec = {id: existingId || makeId('w'), date:f.date, name:f.name||'', part:f.part||'', volume:f.volume||null, calories:f.calories?num(f.calories):null, note:f.note||'', treadmillSteps: f.treadmillSteps?num(f.treadmillSteps):null};
    }
    // 2026-08-13 근본 수정: 기존엔 같은 날짜의 기존 워크아웃 기록을 전부 지우고 새 항목
    // 하나로 바꿔버려서, 하루에 두 번째 운동(예: 오전 근력 + 저녁 유산소)을 모달로 추가하면
    // 첫 번째 기록이 조용히 사라지는 데이터 유실 버그가 있었다(분석 로직은 하루 여러 건을
    // 전제로 설계돼 있었는데 저장 로직만 1건 가정이었음). 이제 id 기준으로 "그 항목만"
    // 교체(수정)하거나, id가 없으면 새 항목으로 추가한다 — 같은 날짜의 다른 항목은 안 건드림.
    if(existingId){
      state.workouts = state.workouts.map(r => r.id===existingId ? rec : r);
    } else {
      state.workouts = [...state.workouts, rec];
    }
    saveArr(LS_KEYS.workout, state.workouts);
  }
  markUpdated();
  closeModal();
}
// 2026-08-16 추가: 삼성헬스 스크린샷을 Claude 채팅에 올리면 Claude가 이 앱의 워크아웃 레코드
// 형식(JSON)으로 값을 만들어주고, 그걸 여기 붙여넣기만 하면 등록되게 하는 기능. 기존엔
// "Claude가 note 자유텍스트를 만들어주면 → 그걸 나중에 이 앱의 정규식이 다시 파싱"하는
// 구조라 표현이 바뀔 때마다 걸음수를 놓치는 문제가 반복됐다(parseSteps 관련 3차 수정 이력 참고).
// 이제 Claude가 처음부터 treadmillSteps 등 구조화된 필드값을 직접 채워서 JSON으로 주고,
// 앱은 그 값을 그대로 신뢰해서 저장만 하므로 표현/문구에 좌우되지 않는다.
// 기대 스키마: [{date, name, part, volume?, calories?, note?, treadmillSteps?, id?}, ...]
// id가 있고 기존 기록에 같은 id가 있으면 그 기록을 수정, 없으면 새 기록으로 추가한다.
function importWorkoutJSON(){
  const el = document.getElementById('workout-json-input');
  const raw = (el ? el.value : (modalState.workoutJsonText||'')).trim();
  if(!raw){ alert('붙여넣은 JSON이 없어요.'); return; }
  let parsed;
  try{ parsed = JSON.parse(raw); }
  catch(e){ alert('JSON 형식이 올바르지 않아요. Claude에게 이 앱 형식으로 다시 만들어달라고 해주세요.\n\n오류: ' + e.message); return; }
  const arr = Array.isArray(parsed) ? parsed : [parsed];
  if(!arr.length){ alert('빈 JSON이에요.'); return; }
  if(arr.some(r => !r || !r.date)){ alert('date(YYYY-MM-DD)가 없는 항목이 있어요. 모든 항목에 날짜가 필요해요.'); return; }
  let added = 0, updated = 0;
  arr.forEach(r => {
    const rec = {
      id: r.id || makeId('w'),
      date: r.date,
      name: r.name || '',
      part: r.part || '',
      volume: r.volume || null,
      calories: r.calories!=null ? num(r.calories) : null,
      note: r.note || '',
      treadmillSteps: r.treadmillSteps!=null ? num(r.treadmillSteps) : null,
    };
    const idx = state.workouts.findIndex(w => w.id === rec.id);
    if(idx >= 0){ state.workouts[idx] = rec; updated++; }
    else { state.workouts = [...state.workouts, rec]; added++; }
  });
  saveArr(LS_KEYS.workout, state.workouts);
  markUpdated();
  modalState.workoutJsonText = '';
  alert(`등록 완료 — 신규 ${added}건${updated?`, 수정 ${updated}건`:''}.`);
  closeModal();
  render();
}
// 2026-08-13 추가: 즐겨찾기 음식을 오늘 식단에 원클릭으로 합산. 식단은 날짜당 1건(하루 총합)
// 구조라, 모달을 열지 않고 오늘 레코드를 찾아 없으면 새로 만들고 있으면 매크로만 더한다.
function quickAddFavorite(favId, targetDate){
  const fav = state.favorites.find(f=>f.id===favId);
  if(!fav) return;
  const date = targetDate || todayISO();
  const existing = state.meals.find(m=>m.date===date);
  if(existing){
    existing.calories = (existing.calories||0) + (fav.calories||0);
    existing.protein = (existing.protein||0) + (fav.protein||0);
    existing.carbs = (existing.carbs||0) + (fav.carbs||0);
    existing.note = existing.note ? `${existing.note} · ${fav.name}` : fav.name;
  } else {
    state.meals.push({date, calories:fav.calories||0, protein:fav.protein||0, carbs:fav.carbs||0, note:fav.name, specialDayType:null});
  }
  saveArr(LS_KEYS.meal, state.meals);
  markUpdated();
  render();
}
function addFavorite(){
  const name = document.getElementById('fav-name-input').value.trim();
  const cal = Number(document.getElementById('fav-cal-input').value);
  const protein = Number(document.getElementById('fav-protein-input').value)||0;
  const carbs = Number(document.getElementById('fav-carbs-input').value)||0;
  if(!name || !cal){ alert('이름과 칼로리는 필수예요.'); return; }
  state.favorites.push({id:makeId('fav'), name, calories:cal, protein, carbs});
  saveArr(LS_KEYS.favorites, state.favorites);
  render();
}
function deleteFavorite(id){
  state.favorites = state.favorites.filter(f=>f.id!==id);
  saveArr(LS_KEYS.favorites, state.favorites);
  render();
}
function inferPartFromName(name){
  if(!name) return '';
  if(EXERCISE_PART_MAP[name]) return EXERCISE_PART_MAP[name];
  const found = Object.keys(EXERCISE_PART_MAP).find(k => name.includes(k) || k.includes(name));
  return found ? EXERCISE_PART_MAP[found] : '';
}
function num(v){ const n = Number(v); return isNaN(n) ? null : n; }

render();
// [2026-07-17 제거 → 2026-08-04 재도입 → 2026-08-04 머니트레일 벤치마킹 반영]
// 예전엔 앱 열릴 때마다 자동으로 도는 백그라운드(silent) 동기화가 25초+ 걸리다 보니,
// 이 자동 동기화와 사용자의 수동 "지금 동기화" 클릭이 충돌해서 배지가 안 뜨거나 늦게 뜨는
// 문제가 반복 재발해 통째로 제거했었음. 이후(7/17~7/26) 아래 근본 원인들을 고쳐뒀음:
//   - syncing 잠금 변수로 두 요청이 동시에 나가는 것 자체를 차단(이미 있었음)
//   - 배지를 render() 타이밍에 기대지 않고 클릭/상태변화 즉시 직접 DOM으로 그리도록 재작성
//   - pull→로컬정리→push 순서로 바꿔 삭제된 데이터가 재업로드로 되살아나는 버그 해결
// 여기에 더해 2026-08-04에 syncUiStatus 갱신을 !silent 조건 없이 항상 수행하도록 바꿔서,
// 자동 동기화도 대시보드 상단 배너로 보이도록 함(재도입의 핵심 이유 — 정희님이 동기화가
// 도는지 안 도는지 인지할 수 있어야 함). silent 파라미터는 이제 "URL 미설정 시 alert를
// 띄우지 않는다"는 의미로만 남음.
// [벤치마킹] 같은 날 다른 프로젝트(머니트레일 앱)의 자동동기화 구현을 비교 검토해 2가지를 추가 반영:
//   - 스로틀링: AUTO_SYNC_THROTTLE_MS(5분) 이내 재방문이면 자동 동기화를 스킵(수동 버튼은 예외).
//     매번 무조건 풀+푸시하던 기존 방식보다 불필요한 네트워크 호출·Apps Script 실행 횟수를 줄임.
//   - 지연 시작: 초기 렌더가 화면에 그려질 기회를 준 뒤(AUTO_SYNC_START_DELAY_MS=1.5초) 시작 —
//     첫 화면이 뜨자마자 네트워크 요청이 끼어들어 로딩이 느려 보이는 느낌을 줄임.
if((localStorage.getItem(LS_KEYS.cloudurl)||'').trim()){
  const lastAutoRaw = localStorage.getItem(LS_KEYS.lastautosync);
  const elapsed = lastAutoRaw ? (Date.now() - new Date(lastAutoRaw).getTime()) : Infinity;
  if(elapsed >= AUTO_SYNC_THROTTLE_MS){
    setTimeout(() => cloudSync(true), AUTO_SYNC_START_DELAY_MS);
  }
}

// 2026-07-25 복원: 이 서비스워커 등록 코드가 이전 index.html에서 누락돼 있었음(원인 불명 —

// "코드를 아무리 고쳐 올려도 반영이 안 되는" 문제가 반복됐음. 재등록 + sw.js 자체의 캐시
// 전략도 network-first로 변경(아래 sw.js 참고)해서 향후 이런 문제가 재발하지 않도록 함.
if('serviceWorker' in navigator){
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('./sw.js').catch(err => console.error('SW 등록 실패:', err));
